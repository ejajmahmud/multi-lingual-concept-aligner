[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-lingual-concept-aligner"
version = "0.1.0"
description = "Vector space projection mapping non-English technical queries into normalized multilingual embedding manifolds"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
multi-lingual-concept-aligner = "multi_lingual_concept_aligner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multi_lingual_concept_aligner*"]
